<title>Study Hub</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#121212;
    color:white;
}

header{
    background:#1f1f1f;
    padding:20px;
    text-align:center;
    font-size:30px;
    font-weight:bold;
}

.games{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:20px;
}

.card{
    background:#1e1e1e;
    border-radius:12px;
    overflow:hidden;
    transition:0.3s;
}

.card:hover{
    transform:scale(1.05);
}

.card img{
    width:100%;
    height:160px;
    object-fit:cover;
}

.card h2{
    padding:10px;
}

.play-btn{
    display:block;
    text-align:center;
    background:#00b894;
    color:white;
    padding:12px;
    text-decoration:none;
    font-weight:bold;
}

.play-btn:hover{
    background:#00a383;
}

.math-btn,
.play-btn{
    display:block;
    width:240px;
    max-width:calc(100% - 20px);
    height:90px;
    margin:12px auto;
    font-size:0.9rem;
    cursor:pointer;
    padding:6px 10px;
    border-radius:6px;
    background-color:#4CAF50;
    color:white;
    border:none;
    font-weight:bold;
}

.math-btn:hover,
.play-btn:hover{
    background-color:#45a049;
}

#start-screen{
 position:fixed; inset:0; z-index:9999; background:#262626;
 display:flex; flex-direction:column; align-items:center; justify-content:center;
 padding:18px; box-sizing:border-box; text-align:center;
}
#start-screen img{max-width:100%; max-height:78vh; object-fit:contain; display:block;}
#start-screen button{margin-top:18px; padding:14px 34px; border:0; border-radius:8px;
 background:#4CAF50; color:#fff; font-size:20px; font-weight:bold; cursor:pointer;}
#start-screen button:hover{background:#45a049;}

</style>
</head>

<script>
// Type GG on your keyboard to dismiss the start screen and show the game hub.
let lastGTime = 0;
document.addEventListener('keydown', function(event) {
    if (event.key.toLowerCase() !== 'g' || event.repeat) return;
    const now = Date.now();
    if (now - lastGTime <= 1000) {
        const startScreen = document.getElementById('start-screen');
        if (startScreen) startScreen.remove();
        lastGTime = 0;
    } else {
        lastGTime = now;
    }
});

function openGameCDN(){
    openCDN('https://cdn.jsdelivr.net/gh/Bobwastaked/ugs-singlefile/AASINGLEFILE.html', 'Game');
}

function openCDN(baseUrl, pageName){
    const newWin = window.open('about:blank', '_blank');
    if (!newWin) {
        alert('Please allow pop-ups for this page, then try again.');
        return;
    }
    const cdnUrl = baseUrl + (baseUrl.includes('?') ? '&' : '?') + 't=' + Date.now();
    fetch(cdnUrl)
        .then(response => {
            if (!response.ok) throw new Error('Could not load the ' + pageName + ' CDN.');
            return response.text();
        })
        .then(html => {
            newWin.document.open();
            newWin.document.write(html);
            newWin.document.close();
        })
        .catch(error => {
            newWin.close();
            alert('Could not load the ' + pageName + ' page. Please check the CDN link and try again.');
            console.error(error);
        });
}
</script>
